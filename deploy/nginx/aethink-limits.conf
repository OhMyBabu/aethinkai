# AethinkAI — edge limits (http context)
server_tokens off;

# request-rate zones keyed on the real client IP behind the terminator
limit_req_zone $binary_remote_addr zone=aethink_api:10m   rate=15r/s;
limit_req_zone $binary_remote_addr zone=aethink_auth:10m  rate=8r/m;
limit_req_zone $binary_remote_addr zone=aethink_data:10m  rate=25r/s;
limit_req_zone $binary_remote_addr zone=aethink_generic:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=aethink_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=9router:10m rate=40r/s;
