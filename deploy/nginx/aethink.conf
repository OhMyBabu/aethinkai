# AethinkAI — single origin: SPA + /api + /v1 on the gateway host
# Public host: router.aethink.ai.id (DNS/TLS to be attached at hosting time)
upstream aethink_gateway { server 127.0.0.1:8080; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name router.aethink.ai.id aethink.ai.id www.aethink.ai.id _;

    root /var/www/aethink;
    index index.html;
    client_max_body_size 25m;

    # security headers (HTTPS terminator may add HSTS)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- API + data plane -------------------------------------------------
    location /api/ {
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # SSE live feed must not be buffered
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /v1/ {
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # stream token-by-token
        add_header X-Accel-Buffering "no" always;
    }

    location = /health {
        proxy_pass http://aethink_gateway;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- static SPA -------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
