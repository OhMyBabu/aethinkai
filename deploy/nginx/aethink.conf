# AethinkAI — single origin: SPA + /api + /v1 on the gateway host
# Public host: router.aethink.ai.id
#
# Security posture:
#   * edge rate limits + connection cap per IP (conf.d/aethink-limits.conf)
#   * docs/openapi are NOT public: 404 at the edge
#   * strict headers on every response (nginx drops the parent add_header set
#     inside a location, so each location re-declares what it needs)
#   * server_tokens off — no version banner
upstream aethink_gateway { server 127.0.0.1:8080; keepalive 32; }

server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/router.aethink.ai.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/router.aethink.ai.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    ssl_stapling on;
    ssl_stapling_verify on;

    server_name router.aethink.ai.id aethink.ai.id www.aethink.ai.id _;

    root /var/www/aethink;
    index index.html;
    client_max_body_size 25m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    # ---- baseline headers ------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; form-action 'self'; upgrade-insecure-requests" always;

    limit_conn aethink_conn 32;

    # ---- never public ----------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json|api/openapi\.json)$ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(env|sql|bak|old|log|ini|conf|pem|key)$ {
        deny all;
    }

    # ---- auth endpoints: strict rate limit -------------------------------
    location = /api/auth/login {
        limit_req zone=aethink_auth burst=6 nodelay;
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
    location = /api/tg/session {
        limit_req zone=aethink_auth burst=10 nodelay;
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- API + data plane ------------------------------------------------
    location /api/ {
        limit_req zone=aethink_api burst=30 nodelay;
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # SSE live feed must not be buffered
        proxy_hide_header Server;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /v1/ {
        limit_req zone=aethink_data burst=60 nodelay;
        proxy_pass http://aethink_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # stream token-by-token
        proxy_hide_header Server;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Accel-Buffering "no" always;
    }

    location = /health {
        proxy_pass http://aethink_gateway;
        proxy_set_header Host $host;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- static SPA -------------------------------------------------------
    location /assets/ {
        limit_req zone=aethink_generic burst=80 nodelay;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=aethink_generic burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name router.aethink.ai.id aethink.ai.id www.aethink.ai.id _;
    if ($host = router.aethink.ai.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    return 404; # managed by Certbot
}
