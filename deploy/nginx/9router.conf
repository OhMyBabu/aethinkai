# 9Router dashboard — TLS on :8443, HTTP basic auth, loopback upstream.
# The router API itself (127.0.0.1:20128) is never exposed: only the dashboard
# is proxied, and only to an authenticated operator.
server {
    listen 8443 ssl http2;

    server_name router.aethink.ai.id;

    ssl_certificate     /etc/letsencrypt/live/router.aethink.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/router.aethink.ai.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    auth_basic "9Router";
    auth_basic_user_file /etc/nginx/.htpasswd-9router;

    # Next.js dashes fire dozens of RSC fetches at once; the API zone choked the
    # operator's own browser and fail2ban banned them. Operator console, own zone.
    limit_req zone=9router burst=200 nodelay;
    limit_req_status 429;

    # The router's own API is loopback-only business (the gateway talks to
    # 127.0.0.1:20128 directly). Exposing it next to the console would be a second
    # door into the same credentials with weaker auth, so it is not reachable here.
    location ^~ /v1/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
